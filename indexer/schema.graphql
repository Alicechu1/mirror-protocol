type BaselineRegistered @entity {
  id: ID!
  user: String!
  commitmentHash: String!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: String!
}

type BaselineUpdated @entity {
  id: ID!
  user: String!
  newCommitmentHash: String!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: String!
}

type AgentRegistered @entity {
  id: ID!
  agent: String!
  owner: String!
  persona: String!
  generationId: BigInt!
  blockNumber: BigInt!
  transactionHash: String!
}

type AgentAuthorizationChanged @entity {
  id: ID!
  agent: String!
  isAuthorized: Boolean!
  blockNumber: BigInt!
  transactionHash: String!
}

type ActionAttested @entity {
  id: ID!
  attestationId: BigInt!
  agent: String!
  actionHash: String!
  isVerified: Boolean!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: String!
}

type CircuitBreakerTriggered @entity {
  id: ID!
  agent: String!
  attestationId: BigInt!
  reason: String!
  blockNumber: BigInt!
  transactionHash: String!
}

type ZKActionAttested @entity {
  id: ID!
  attestationId: BigInt!
  agent: String!
  actionHash: String!
  baselineCommitment: BigInt!
  actionCommitment: BigInt!
  compliant: Boolean!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: String!
}

type ZKVerificationRejected @entity {
  id: ID!
  agent: String!
  baselineCommitment: BigInt!
  actionCommitment: BigInt!
  reason: String!
  blockNumber: BigInt!
  transactionHash: String!
}

type ZKCircuitBreakerTriggered @entity {
  id: ID!
  agent: String!
  attestationId: BigInt!
  violations: BigInt!
  blockNumber: BigInt!
  transactionHash: String!
}

# Aggregated stats for dashboard
type ProtocolStats @entity {
  id: ID!
  totalBaselines: Int!
  totalAgents: Int!
  totalAttestations: Int!
  totalZKAttestations: Int!
  totalViolations: Int!
  totalZKViolations: Int!
}
