[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.19"
optimizer = true
optimizer_runs = 200
via_ir = false

# Monad Testnet configuration
[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"

[etherscan]
# Monad doesn't have etherscan, but you can use a block explorer if available
monad = { key = "unused", url = "https://testnet.monadexplorer.com/api" }
